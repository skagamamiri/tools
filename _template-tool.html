<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#071a16">
<title>Nama Tool • Hub Tool ICT</title>
<link rel="icon" href="data:,">
<!-- Header bersama ICT HUB: WAJIB untuk setiap tool -->
<script src="ict-header.js"></script>
<!--
  TEMPLAT TOOL BAHARU ICT HUB
  1. Salin fail ini dan namakan semula (contoh: kehadiran.html).
  2. Tukar <title> dan atribut <ict-header> di bawah.
     Ikon: https://fontawesome.com/search?ic=free (contoh "fa-solid fa-clipboard-check")
  3. Tulis kandungan tool dalam <main>.
  4. Tambah tool di Panel Pentadbir ICT HUB, jenis URL:
     https://skagamamiri.github.io/tools/kehadiran.html
  Jangan letak butang log keluar dalam header.
-->
<style>
  * { box-sizing:border-box; }
  body {
    margin:0; background:#f5f8fa; color:#172033;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  main { width:min(1180px,calc(100% - 32px)); margin:24px auto 50px; }
  .card {
    background:#fff; border:1px solid #dce5eb; border-radius:22px; padding:22px;
    box-shadow:0 10px 30px #18314d0d;
  }
  .footer { text-align:center; color:#91a0ae; font-size:11px; padding:25px; }
</style>
</head>
<body>

<ict-header
  icon="fa-solid fa-toolbox"
  title="Nama Tool"
  subtitle="Penerangan ringkas tentang tool ini.">
</ict-header>

<main>
  <section class="card">
    <h2 style="margin-top:0">Kandungan tool</h2>
    <p>Letak borang, senarai atau fungsi tool di sini.</p>
  </section>
</main>

<div class="footer">Hub Tool ICT • SK Agama (MIS) Miri</div>

<!--
  Jika tool perlu log masuk guru (Firebase), selepas guru disahkan panggil:
    ICTHeader.setUser(namaGuru, "GURU");   // atau "ADMIN"
  Rujuk aktiviti.html sebagai contoh lengkap.
-->
</body>
</html>
