<!-- ============================================================
     DAFTAR AKTIVITI SEKOLAH — ICT HUB
     Tampal SELURUH blok ini dalam index.html, betul-betul selepas
     penutup <div id="emptyState"> ... </div> dan SEBELUM
     <!-- Footer FRONTEND -->.
     Data disimpan dalam Firestore koleksi "aktiviti".
     ============================================================ -->
<section id="aktivitiSection" class="mt-8">
    <div class="flex items-center justify-between mb-3 gap-3">
        <h3 class="font-heading font-bold text-sm md:text-base text-slate-700 dark:text-slate-300 flex items-center">
            <i class="fa-solid fa-calendar-days mr-2 text-brand-600"></i>
            <span>Aktiviti Akan Datang</span>
            <span id="aktivitiCount" class="ml-2 px-2 py-0.5 rounded-full text-[11px] bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-semibold">0</span>
        </h3>
        <button type="button" id="aktivitiAddBtn"
            class="px-3 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-semibold shadow-md transition whitespace-nowrap">
            <i class="fa-solid fa-plus mr-1.5"></i>Daftar Aktiviti
        </button>
    </div>

    <div id="aktivitiList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="col-span-full py-8 text-center text-xs text-slate-400">
            <i class="fa-solid fa-spinner fa-spin mr-1.5"></i>Memuatkan aktiviti...
        </div>
    </div>

    <div class="text-center mt-3">
        <button type="button" id="aktivitiMoreBtn"
            class="hidden px-4 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:border-brand-500/50 transition">
            Lihat semua aktiviti
        </button>
    </div>
</section>

<!-- Modal Daftar Aktiviti -->
<div id="aktivitiModal" class="hidden fixed inset-0 z-[90] bg-slate-900/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="w-full sm:max-w-lg bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 max-h-[92vh] overflow-y-auto">
        <div class="flex items-center justify-between px-5 pt-5 pb-3 border-b border-slate-100 dark:border-slate-800">
            <div>
                <h4 class="font-heading font-bold text-base text-slate-800 dark:text-slate-100">Daftar Aktiviti</h4>
                <p class="text-[11px] text-slate-400 mt-0.5">Aktiviti akan dipaparkan di muka hadapan ICT HUB.</p>
            </div>
            <button type="button" id="aktivitiCloseBtn" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-700 dark:hover:text-slate-200" aria-label="Tutup">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form id="aktivitiForm" class="p-5 grid gap-3 text-xs">
            <label class="font-semibold text-slate-600 dark:text-slate-300">Nama Aktiviti *
                <input id="akTajuk" type="text" maxlength="120" required placeholder="Contoh: Hari Sukan Tahunan"
                    class="mt-1 w-full px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500/40">
            </label>

            <div class="grid grid-cols-2 gap-3">
                <label class="font-semibold text-slate-600 dark:text-slate-300">Tarikh Mula *
                    <input id="akTarikh" type="date" required
                        class="mt-1 w-full px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500/40">
                </label>
                <label class="font-semibold text-slate-600 dark:text-slate-300">Tarikh Tamat
                    <input id="akTarikhTamat" type="date"
                        class="mt-1 w-full px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500/40">
                </label>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <label class="font-semibold text-slate-600 dark:text-slate-300">Masa Mula
                    <input id="akMasaMula" type="time"
                        class="mt-1 w-full px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500/40">
                </label>
                <label class="font-semibold text-slate-600 dark:text-slate-300">Masa Tamat
                    <input id="akMasaTamat" type="time"
                        class="mt-1 w-full px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500/40">
                </label>
            </div>

            <label class="font-semibold text-slate-600 dark:text-slate-300">Tempat *
                <input id="akTempat" type="text" maxlength="80" required placeholder="Contoh: Dewan Ibnu Khaldun"
                    class="mt-1 w-full px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500/40">
            </label>

            <div class="grid grid-cols-2 gap-3">
                <label class="font-semibold text-slate-600 dark:text-slate-300">Kategori
                    <select id="akKategori"
                        class="mt-1 w-full px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500/40">
                        <option>Kurikulum</option>
                        <option>Kokurikulum</option>
                        <option>Hal Ehwal Murid</option>
                        <option>Pentadbiran</option>
                        <option>Mesyuarat</option>
                        <option>Keagamaan</option>
                        <option>Lain-lain</option>
                    </select>
                </label>
                <label class="font-semibold text-slate-600 dark:text-slate-300">Penganjur / Unit
                    <input id="akPenganjur" type="text" maxlength="60" placeholder="Contoh: Unit Kokurikulum"
                        class="mt-1 w-full px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500/40">
                </label>
            </div>

            <label class="font-semibold text-slate-600 dark:text-slate-300">Catatan
                <textarea id="akCatatan" rows="3" maxlength="400" placeholder="Maklumat tambahan (pakaian, peserta, dll.)"
                    class="mt-1 w-full px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500/40"></textarea>
            </label>

            <button id="akSubmitBtn" type="submit"
                class="mt-1 w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold shadow-md transition disabled:opacity-50">
                <i class="fa-solid fa-floppy-disk mr-1.5"></i>Simpan Aktiviti
            </button>
        </form>
    </div>
</div>

<script type="module">
    // Versi SDK MESTI sama dengan index.html (10.13.2) supaya berkongsi
    // Firebase app & sesi log masuk yang sama.
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
    import {
        getFirestore, collection, query, where, getDocs, addDoc, deleteDoc, doc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAPz0zv7RuEHHrmVyO8ECLHv-Hn3dGDZnE",
        authDomain: "skamis-hubtool.firebaseapp.com",
        projectId: "skamis-hubtool",
        storageBucket: "skamis-hubtool.firebasestorage.app",
        messagingSenderId: "236769370780",
        appId: "1:236769370780:web:9dfa07d772a721ecfe0359"
    };

    const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const COLLECTION = "aktiviti";
    const SHOW_LIMIT = 6;
    const $ = (id) => document.getElementById(id);

    let senarai = [];
    let showAll = false;

    const KATEGORI_WARNA = {
        "Kurikulum":       "bg-blue-100 text-blue-700 dark:bg-blue-500/15 dark:text-blue-300",
        "Kokurikulum":     "bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300",
        "Hal Ehwal Murid": "bg-amber-100 text-amber-700 dark:bg-amber-500/15 dark:text-amber-300",
        "Pentadbiran":     "bg-slate-200 text-slate-700 dark:bg-slate-700 dark:text-slate-200",
        "Mesyuarat":       "bg-purple-100 text-purple-700 dark:bg-purple-500/15 dark:text-purple-300",
        "Keagamaan":       "bg-teal-100 text-teal-700 dark:bg-teal-500/15 dark:text-teal-300",
        "Lain-lain":       "bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-300"
    };
    const BULAN = ["JAN","FEB","MAC","APR","MEI","JUN","JUL","OGO","SEP","OKT","NOV","DIS"];
    const HARI = ["Ahad","Isnin","Selasa","Rabu","Khamis","Jumaat","Sabtu"];

    function esc(v) {
        return String(v ?? "").replace(/[&<>"']/g, c => ({
            "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
        }[c]));
    }

    function todayStr() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }

    function parseDate(s) {
        const [y, m, d] = String(s).split("-").map(Number);
        return new Date(y, m - 1, d);
    }

    function fmtDate(s) {
        const d = parseDate(s);
        return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()].charAt(0)}${BULAN[d.getMonth()].slice(1).toLowerCase()} ${d.getFullYear()}`;
    }

    function relLabel(a) {
        const today = parseDate(todayStr());
        const mula = parseDate(a.tarikh);
        const tamat = parseDate(a.tarikhTamat || a.tarikh);
        const diff = Math.round((mula - today) / 86400000);
        if (mula <= today && tamat >= today) return { text: "Hari ini", cls: "bg-rose-500 text-white" };
        if (diff === 1) return { text: "Esok", cls: "bg-amber-500 text-white" };
        if (diff <= 7) return { text: `${diff} hari lagi`, cls: "bg-brand-600 text-white" };
        return { text: `${diff} hari lagi`, cls: "bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-300" };
    }

    function canDelete(a) {
        const t = window.currentTeacher;
        if (!t) return false;
        const email = String(t.email || "").toLowerCase();
        return t.role === "admin" || (a.email && a.email.toLowerCase() === email);
    }

    function toast(msg, type = "success") {
        const el = document.getElementById("toast");
        if (el) el.style.zIndex = "100"; // supaya mesej kelihatan di atas modal
        if (typeof window.showToast === "function") window.showToast(msg, type);
        else alert(msg);
    }

    async function loadAktiviti() {
        try {
            // Ambil aktiviti yang tarikh tamatnya belum berlalu.
            const q = query(collection(db, COLLECTION), where("tarikhAkhir", ">=", todayStr()));
            const snap = await getDocs(q);
            senarai = snap.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .sort((a, b) =>
                    String(a.tarikh).localeCompare(String(b.tarikh)) ||
                    String(a.masaMula || "99:99").localeCompare(String(b.masaMula || "99:99")));
            render();
        } catch (err) {
            console.error("Gagal memuatkan aktiviti:", err);
            $("aktivitiList").innerHTML = `
                <div class="col-span-full py-8 text-center text-xs text-rose-500 bg-rose-50 dark:bg-rose-500/10 rounded-2xl border border-dashed border-rose-200 dark:border-rose-500/30">
                    <i class="fa-solid fa-circle-exclamation mr-1.5"></i>Aktiviti tidak dapat dimuatkan. ${esc(err.code || err.message || "")}
                </div>`;
        }
    }

    function render() {
        const list = $("aktivitiList");
        $("aktivitiCount").textContent = senarai.length;

        if (!senarai.length) {
            list.innerHTML = `
                <div class="col-span-full py-10 text-center bg-white dark:bg-slate-800/50 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700 px-4">
                    <div class="w-12 h-12 mx-auto rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-400 mb-2">
                        <i class="fa-solid fa-calendar-xmark text-lg"></i>
                    </div>
                    <p class="font-heading font-bold text-slate-700 dark:text-slate-300 text-sm">Tiada aktiviti akan datang</p>
                    <p class="text-[11px] text-slate-400 mt-1">Tekan "Daftar Aktiviti" untuk menambah aktiviti baharu.</p>
                </div>`;
            $("aktivitiMoreBtn").classList.add("hidden");
            return;
        }

        const items = showAll ? senarai : senarai.slice(0, SHOW_LIMIT);
        list.innerHTML = items.map(a => {
            const d = parseDate(a.tarikh);
            const rel = relLabel(a);
            const warna = KATEGORI_WARNA[a.kategori] || KATEGORI_WARNA["Lain-lain"];
            const julatTarikh = a.tarikhTamat && a.tarikhTamat !== a.tarikh
                ? `${fmtDate(a.tarikh)} – ${fmtDate(a.tarikhTamat)}`
                : fmtDate(a.tarikh);
            const masa = a.masaMula
                ? `${esc(a.masaMula)}${a.masaTamat ? " – " + esc(a.masaTamat) : ""}`
                : "";
            return `
            <article class="glass-card p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800/80 bg-white dark:bg-slate-800/60 flex gap-3">
                <div class="flex-shrink-0 w-14 text-center rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700 self-start">
                    <div class="bg-brand-600 text-white text-[10px] font-bold py-0.5">${BULAN[d.getMonth()]}</div>
                    <div class="text-xl font-black text-slate-800 dark:text-slate-100 py-1">${d.getDate()}</div>
                </div>
                <div class="min-w-0 flex-1">
                    <div class="flex flex-wrap items-center gap-1.5 mb-1">
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${rel.cls}">${rel.text}</span>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${warna}">${esc(a.kategori || "Lain-lain")}</span>
                    </div>
                    <h4 class="font-heading font-bold text-sm text-slate-800 dark:text-slate-100 leading-snug break-words">${esc(a.tajuk)}</h4>
                    <div class="mt-1.5 space-y-0.5 text-[11px] text-slate-500 dark:text-slate-400">
                        <p><i class="fa-regular fa-calendar w-4"></i>${julatTarikh}</p>
                        ${masa ? `<p><i class="fa-regular fa-clock w-4"></i>${masa}</p>` : ""}
                        <p class="break-words"><i class="fa-solid fa-location-dot w-4"></i>${esc(a.tempat)}</p>
                        ${a.penganjur ? `<p class="break-words"><i class="fa-solid fa-users w-4"></i>${esc(a.penganjur)}</p>` : ""}
                    </div>
                    ${a.catatan ? `<p class="mt-2 text-[11px] text-slate-600 dark:text-slate-300 bg-slate-50 dark:bg-slate-900/60 rounded-lg px-2 py-1.5 break-words">${esc(a.catatan)}</p>` : ""}
                    <div class="mt-2 flex items-center justify-between gap-2">
                        <span class="text-[10px] text-slate-400 truncate">Didaftar oleh ${esc(a.namaGuru || a.email || "-")}</span>
                        ${canDelete(a) ? `<button type="button" data-del="${esc(a.id)}" class="ak-del text-[10px] font-bold px-2 py-1 rounded-lg bg-rose-50 text-rose-600 dark:bg-rose-500/10 dark:text-rose-300 hover:bg-rose-100"><i class="fa-solid fa-trash-can mr-1"></i>Padam</button>` : ""}
                    </div>
                </div>
            </article>`;
        }).join("");

        list.querySelectorAll(".ak-del").forEach(btn =>
            btn.addEventListener("click", () => padamAktiviti(btn.dataset.del)));

        const more = $("aktivitiMoreBtn");
        if (senarai.length > SHOW_LIMIT) {
            more.classList.remove("hidden");
            more.textContent = showAll ? "Tunjuk kurang" : `Lihat semua aktiviti (${senarai.length})`;
        } else {
            more.classList.add("hidden");
        }
    }

    function bukaModal() {
        if (!window.currentTeacher || !auth.currentUser) {
            toast("Sila log masuk sebagai guru untuk mendaftar aktiviti.", "info");
            const loginBtn = document.getElementById("teacherLoginHeaderBtn");
            if (loginBtn) loginBtn.click();
            return;
        }
        $("aktivitiForm").reset();
        $("akTarikh").value = todayStr();
        $("akTarikh").min = todayStr();
        $("akTarikhTamat").min = todayStr();
        $("aktivitiModal").classList.remove("hidden");
        document.body.style.overflow = "hidden";
        setTimeout(() => $("akTajuk").focus(), 50);
    }

    function tutupModal() {
        $("aktivitiModal").classList.add("hidden");
        document.body.style.overflow = "";
    }

    async function simpanAktiviti(e) {
        e.preventDefault();
        const user = auth.currentUser;
        const t = window.currentTeacher;
        if (!user || !t) { toast("Sesi log masuk tamat. Sila log masuk semula.", "info"); return; }

        const tajuk = $("akTajuk").value.trim();
        const tarikh = $("akTarikh").value;
        const tarikhTamat = $("akTarikhTamat").value || "";
        const masaMula = $("akMasaMula").value || "";
        const masaTamat = $("akMasaTamat").value || "";
        const tempat = $("akTempat").value.trim();

        if (!tajuk || !tarikh || !tempat) { toast("Sila isi nama aktiviti, tarikh dan tempat.", "info"); return; }
        if (tarikh < todayStr()) { toast("Tarikh aktiviti tidak boleh tarikh yang telah berlalu.", "info"); return; }
        if (tarikhTamat && tarikhTamat < tarikh) { toast("Tarikh tamat mesti selepas tarikh mula.", "info"); return; }
        if (masaMula && masaTamat && masaTamat <= masaMula && (!tarikhTamat || tarikhTamat === tarikh)) {
            toast("Masa tamat mesti selepas masa mula.", "info"); return;
        }

        const btn = $("akSubmitBtn");
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i>Menyimpan...';

        try {
            await addDoc(collection(db, COLLECTION), {
                tajuk,
                tarikh,
                tarikhTamat,
                tarikhAkhir: tarikhTamat || tarikh,   // untuk tapis aktiviti yang telah tamat
                masaMula,
                masaTamat,
                tempat,
                kategori: $("akKategori").value,
                penganjur: $("akPenganjur").value.trim(),
                catatan: $("akCatatan").value.trim(),
                uid: user.uid,
                email: String(user.email || "").toLowerCase(),
                namaGuru: t.displayName || user.displayName || user.email,
                createdAt: serverTimestamp()
            });
            tutupModal();
            toast("Aktiviti berjaya didaftarkan.", "success");
            await loadAktiviti();
        } catch (err) {
            console.error(err);
            toast("Gagal menyimpan aktiviti: " + (err.code || err.message), "info");
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1.5"></i>Simpan Aktiviti';
        }
    }

    async function padamAktiviti(id) {
        if (!confirm("Padam aktiviti ini?")) return;
        try {
            await deleteDoc(doc(db, COLLECTION, id));
            toast("Aktiviti telah dipadam.", "success");
            await loadAktiviti();
        } catch (err) {
            console.error(err);
            toast("Gagal memadam aktiviti: " + (err.code || err.message), "info");
        }
    }

    $("aktivitiAddBtn").addEventListener("click", bukaModal);
    $("aktivitiCloseBtn").addEventListener("click", tutupModal);
    $("aktivitiModal").addEventListener("click", e => { if (e.target.id === "aktivitiModal") tutupModal(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") tutupModal(); });
    $("aktivitiForm").addEventListener("submit", simpanAktiviti);
    $("aktivitiMoreBtn").addEventListener("click", () => { showAll = !showAll; render(); });

    // Lukis semula bila status log masuk berubah (untuk butang Padam).
    onAuthStateChanged(auth, () => setTimeout(render, 1200));

    loadAktiviti();
</script>
<!-- ================= TAMAT DAFTAR AKTIVITI ================= -->
